name: Generate contribution animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib.svg?color_snake=#D6538F&color_dots=#FFEAF3,#FBCFE8,#F4A7C3,#EC8FB5,#D6538F
            dist/contrib-dark.svg?color_snake=#F4A7C3&color_dots=#2A1B26,#6B2D4A,#A8466F,#D6538F,#F48FB1

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
